manifestVersion: 1
id: pearl-node
storage:
  dataRoot: data
category: crypto
name: Pearl Node
version: "1.5.5-patch.1"
tagline: Run your own Pearl (PRL) full node
# Community store only; the official store hosts icons itself (omit this field there).
icon: https://raw.githubusercontent.com/NickCalabs/pearl-node/main/assets/icon.svg
description: >-
  Run a full node for Pearl (PRL), the proof-of-useful-work blockchain. Your node downloads and checks every block
  and its zero-knowledge proof itself, so your wallets and miners can trust it instead of someone else's server.


  The first sync downloads the whole chain (about 11 GB, growing about 13 GB a year). It took about 1.5 hours
  on a 2-core machine with an SSD; slower CPUs and hard drives take longer.


  The dashboard shows sync progress, peers, recent blocks and network stats, and gives you the connection
  details for wallets (RPC) and mining software such as pearl-gateway.


  Runs Pearl's official pearld image. Works on CPUs without AVX2 (for example Celeron N3450) and on 64-bit ARM.
releaseNotes: >-
  New dashboard design in Pearl's own style, and an app icon. pearld is unchanged (v1.5.5); your blockchain data is kept.

developer: Pearl Research Labs
website: https://github.com/pearl-research-labs/pearl
dependencies: []
repo: https://github.com/NickCalabs/pearl-node
support: https://github.com/NickCalabs/pearl-node/issues

port: 4108
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: NickCalabs
# Replace with the umbrel-apps pull request URL when submitting to the official store.
submission: https://github.com/NickCalabs/pearl-node

widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "dashboard:8080/api/widget/sync"
    link: ""
    example:
      title: "Pearl sync"
      text: "38.3%"
      progressLabel: "About 1h 2m left"
      progress: 0.383
  - id: "stats"
    type: "four-stats"
    refresh: "10s"
    endpoint: "dashboard:8080/api/widget/stats"
    link: ""
    example:
      items:
        - title: "Connections"
          text: "8"
          subtext: "peers"
        - title: "Block height"
          text: "135.6K"
          subtext: "blocks"
        - title: "Blockchain size"
          text: "10.7"
          subtext: "GB"
        - title: "Hashrate"
          text: "2.62"
          subtext: "EH/s"

backupIgnore:
  - data/pearld/.pearld/data/*
  - data/pearld/.pearld/logs/*
