name: pearld image

# Builds the pearld image for amd64 + arm64, checks it, and on main publishes
# one multi-arch image to ghcr.io/nickcalabs/pearld.
# PRs and manual runs on other branches only build and check.

on:
  push:
    branches: [main]
    paths: [pearld/**, .github/workflows/pearld-image.yml]
  pull_request:
    paths: [pearld/**, .github/workflows/pearld-image.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pearld-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nickcalabs/pearld
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    # arm64 is built under QEMU emulation on an x86 runner: slow but free on a private repo.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (arm64 emulation)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pearld
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: pearld:check
          cache-from: type=gha,scope=pearld-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pearld-${{ matrix.arch }}

      - name: Install check tools
        if: matrix.arch == 'amd64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user binutils

      - name: Check image
        run: pearld/test/check-image.sh pearld:check ${{ matrix.arch }}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build again: every layer comes from the builder's cache, so this
      # pushes exactly what was checked above.
      - name: Push by digest
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pearld
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read upstream version
        id: v
        run: echo "version=$(sed -n 's/^ARG PEARL_VERSION=//p' pearld/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=sha
            type=raw,value=latest

      - name: Create multi-arch image
        working-directory: digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<<"$TAGS"
          for d in *; do args+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${args[@]}"

      - name: Summary
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "### pearld ${VERSION}"
            echo
            echo "Pin this in docker-compose files:"
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
