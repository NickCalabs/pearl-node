name: Dashboard image

# Builds ghcr.io/nickcalabs/pearl-dashboard for amd64 + arm64 and, on main or a
# dashboard-v* tag, publishes it. Both architectures build natively on one
# runner (the web build is CPU-independent and Go cross-compiles), so there is
# no emulation. PRs only build.

on:
  push:
    branches: [main]
    tags: ["dashboard-v*"]
    paths: [dashboard/**, .github/workflows/dashboard-image.yml]
  pull_request:
    paths: [dashboard/**, .github/workflows/dashboard-image.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nickcalabs/pearl-dashboard

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=dashboard-(v.*),group=1
            type=sha
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dashboard
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### pearl-dashboard"
            echo
            echo "Index digest (pin this): \`${DIGEST}\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" | grep -E "Platform|Name" | head -8
