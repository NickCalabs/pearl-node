name: Watch upstream Pearl releases

# Every 6 hours: if pearl-research-labs/pearl has a newer published release than
# the image pinned in pearld/image, and its official image is already on GHCR,
# open a PR that pins the new image by digest and start the image check on that
# branch (PRs opened with GITHUB_TOKEN don't trigger workflows by themselves).
# A human reviews and merges.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM: pearl-research-labs/pearl
      IMAGE: ghcr.io/pearl-research-labs/pearl/pearld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare versions
        id: cmp
        run: |
          current=$(sed -E 's/.*:(v[^@]+)@.*/\1/' pearld/image)
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          echo "current=$current latest=$latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          # Only move forward (sort -V), never "bump" to an older tag.
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)
          if [ "$latest" != "$current" ] && [ "$newest" = "$latest" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open bump PR
        if: steps.cmp.outputs.bump == 'true'
        env:
          CURRENT: ${{ steps.cmp.outputs.current }}
          LATEST: ${{ steps.cmp.outputs.latest }}
        run: |
          branch="bump/pearl-${LATEST}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists; nothing to do."
            exit 0
          fi
          # Upstream tags the image in a separate job after the release. If it isn't
          # there yet, try again on the next run.
          if ! digest=$(docker buildx imagetools inspect "${IMAGE}:${LATEST}" --format '{{json .Manifest}}' | jq -er .digest); then
            echo "::notice::${IMAGE}:${LATEST} is not published yet; will retry next run."
            exit 0
          fi
          echo "${IMAGE}:${LATEST}@${digest}" > pearld/image

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "pearld: pin official image ${LATEST}"
          git push origin "$branch"
          gh workflow run check-image.yml --ref "$branch"

          gh pr create --base main --head "$branch" \
            --title "pearld: pin official image ${LATEST}" \
            --body "Upstream release: https://github.com/${UPSTREAM}/releases/tag/${LATEST}

          - Image: \`${IMAGE}:${LATEST}\`
          - Digest: \`${digest}\` (was ${CURRENT})

          Before merging, check that **Check pearld image** passed on this branch (amd64 + arm64)
          and that the upstream release notes need no config changes." \
          || echo "::warning::Could not open the PR. Open it by hand: https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}"
